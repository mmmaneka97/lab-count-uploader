<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Colony Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }

        .upload-section {
            text-align: center;
            padding: 40px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #e0ffe0;
            color: #060;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .table-section {
            display: none;
            margin-top: 30px;
        }

        .table-header {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            color: #333;
            font-size: 20px;
        }

        .table-info {
            color: #666;
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 13px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        input.cell-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
        }

        input.cell-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .add-row-btn {
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 13px;
        }

        .row-controls {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn-remove {
            padding: 4px 8px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-remove:hover {
            background: #ff5252;
        }

        .delivery-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .header-info {
            color: #666;
            font-size: 13px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Lab Colony Counter</h1>

        <div class="card">
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <!-- Upload Section -->
            <div class="form-group">
                <label>Step 1: Upload Data Sheet Image</label>
                <div class="upload-section" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click or drag to upload image</div>
                    <div class="upload-subtext">JPG, PNG, or any image format</div>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <!-- Preview -->
            <div id="preview" style="display: none; margin: 20px 0;">
                <img id="previewImg" style="max-width: 100%; border-radius: 6px; border: 1px solid #ddd;">
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing image with AI... this may take 15-30 seconds</p>
            </div>

            <!-- Email Section -->
            <div class="form-group" style="margin-top: 20px;">
                <label for="email">Your Email or Slack Handle</label>
                <input type="email" id="email" placeholder="you@lab.com or @yourslackname">
            </div>

            <!-- Delivery Method -->
            <div class="form-group">
                <label>Delivery Method</label>
                <div class="delivery-options">
                    <div class="radio-option">
                        <input type="radio" id="discord" name="delivery" value="discord" checked>
                        <label for="discord">Discord</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="slack" name="delivery" value="slack">
                        <label for="slack">Slack</label>
                    </div>
                </div>
            </div>

            <!-- Initial Controls -->
            <div class="button-group" id="initialControls">
                <button class="btn-primary" id="extractBtn" disabled>Extract Data</button>
            </div>
        </div>

        <!-- Table Section (Hidden until data is extracted) -->
        <div class="card table-section" id="tableSection">
            <div class="table-header">
                <div>
                    <h2>Step 2: Verify & Edit Data</h2>
                    <div class="table-info">Edit any incorrect values. Remove rows you don't need.</div>
                </div>
            </div>

            <div class="header-info" id="headerInfo"></div>

            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th style="width: 25%;">Sample</th>
                            <th style="width: 20%;">Plate 1</th>
                            <th style="width: 20%;">Plate 2</th>
                            <th style="width: 15%;">Dilution</th>
                            <th style="width: 15%;">Notes</th>
                            <th style="width: 5%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <button class="btn-secondary add-row-btn" id="addRowBtn">+ Add Row</button>

            <div class="button-group" style="margin-top: 30px;">
                <button class="btn-secondary" id="backBtn">Back</button>
                <button class="btn-primary" id="sendBtn">Send to Discord</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const loading = document.getElementById('loading');
        const extractBtn = document.getElementById('extractBtn');
        const tableSection = document.getElementById('tableSection');
        const tableBody = document.getElementById('tableBody');
        const backBtn = document.getElementById('backBtn');
        const sendBtn = document.getElementById('sendBtn');
        const addRowBtn = document.getElementById('addRowBtn');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const emailInput = document.getElementById('email');
        const headerInfo = document.getElementById('headerInfo');

        let currentData = null;

        // Upload handling
        uploadArea.addEventListener('click', () => imageInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f0f0ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length) {
                imageInput.files = files;
                handleImageUpload();
            }
        });

        imageInput.addEventListener('change', handleImageUpload);

        function handleImageUpload() {
            const file = imageInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
                extractBtn.disabled = false;
                hideMessages();
            };
            reader.readAsDataURL(file);
        }

        extractBtn.addEventListener('click', async () => {
            if (!imageInput.files.length) {
                showError('Please upload an image first');
                return;
            }

            loading.style.display = 'block';
            extractBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', imageInput.files[0]);

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    showError(`Extraction error: ${data.error}`);
                    loading.style.display = 'none';
                    extractBtn.disabled = false;
                    return;
                }

                currentData = data;
                populateTable(data);
                tableSection.style.display = 'block';
                loading.style.display = 'none';
                window.scrollTo(0, document.querySelector('.card').offsetTop);

            } catch (error) {
                showError(`Error: ${error.message}`);
                loading.style.display = 'none';
                extractBtn.disabled = false;
            }
        });

        function populateTable(data) {
            tableBody.innerHTML = '';

            if (data.header_info) {
                headerInfo.textContent = data.header_info;
            }

            const entries = data.entries || [];
            entries.forEach((entry, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="text" class="cell-input" value="${entry.sample_name || ''}" data-field="sample_name" data-index="${index}"></td>
                    <td><input type="text" class="cell-input" value="${entry.plate_1_count || ''}" data-field="plate_1_count" data-index="${index}"></td>
                    <td><input type="text" class="cell-input" value="${entry.plate_2_count || ''}" data-field="plate_2_count" data-index="${index}"></td>
                    <td><input type="text" class="cell-input" value="${entry.dilution || ''}" data-field="dilution" data-index="${index}"></td>
                    <td><input type="text" class="cell-input" value="${entry.notes || ''}" data-field="notes" data-index="${index}"></td>
                    <td>
                        <div class="row-controls">
                            <button class="btn-remove" onclick="removeRow(${index})">Remove</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Add change listeners
            document.querySelectorAll('.cell-input').forEach(input => {
                input.addEventListener('change', updateCurrentData);
            });
        }

        function updateCurrentData() {
            const inputs = document.querySelectorAll('.cell-input');
            currentData.entries = [];

            // Get max index
            const indices = Array.from(inputs).map(i => parseInt(i.dataset.index));
            const maxIndex = Math.max(...indices, -1);

            for (let i = 0; i <= maxIndex; i++) {
                const rowInputs = document.querySelectorAll(`[data-index="${i}"]`);
                if (rowInputs.length === 0) continue;

                const entry = {};
                rowInputs.forEach(input => {
                    entry[input.dataset.field] = input.value;
                });
                currentData.entries.push(entry);
            }
        }

        function removeRow(index) {
            const rowInputs = document.querySelectorAll(`[data-index="${index}"]`);
            if (rowInputs.length > 0) {
                rowInputs[0].closest('tr').remove();
                updateCurrentData();
            }
        }

        addRowBtn.addEventListener('click', () => {
            updateCurrentData();
            currentData.entries.push({
                sample_name: '',
                plate_1_count: '',
                plate_2_count: '',
                dilution: '',
                notes: ''
            });

            const newIndex = currentData.entries.length - 1;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="cell-input" value="" data-field="sample_name" data-index="${newIndex}"></td>
                <td><input type="text" class="cell-input" value="" data-field="plate_1_count" data-index="${newIndex}"></td>
                <td><input type="text" class="cell-input" value="" data-field="plate_2_count" data-index="${newIndex}"></td>
                <td><input type="text" class="cell-input" value="" data-field="dilution" data-index="${newIndex}"></td>
                <td><input type="text" class="cell-input" value="" data-field="notes" data-index="${newIndex}"></td>
                <td>
                    <div class="row-controls">
                        <button class="btn-remove" onclick="removeRow(${newIndex})">Remove</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);

            row.querySelectorAll('.cell-input').forEach(input => {
                input.addEventListener('change', updateCurrentData);
            });
        });

        backBtn.addEventListener('click', () => {
            tableSection.style.display = 'none';
            extractBtn.disabled = false;
        });

        sendBtn.addEventListener('click', async () => {
            updateCurrentData();

            if (!emailInput.value) {
                showError('Please enter your email or Slack handle');
                return;
            }

            const deliveryMethod = document.querySelector('input[name="delivery"]:checked').value;

            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: currentData,
                        email: emailInput.value,
                        delivery_method: deliveryMethod
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess(`Data sent to ${deliveryMethod}! Check your messages.`);
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                } else {
                    showError(`Error: ${result.error || 'Failed to send'}`);
                }

            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        });

        // Update button text when delivery method changes
        document.querySelectorAll('input[name="delivery"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                sendBtn.textContent = `Send to ${e.target.value.charAt(0).toUpperCase() + e.target.value.slice(1)}`;
            });
        });

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        function hideMessages() {
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
        }
    </script>
</body>
</html>
